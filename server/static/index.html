<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rag-bench Leaderboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Page-specific overrides for the leaderboard index. */
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .controls {
            margin-bottom: 20px;
        }
        th {
            cursor: pointer;
            user-select: none;
        }
        th:hover { color: #58a6ff; }
        th.sorted { color: #58a6ff; }
        .rank { color: #8b949e; font-weight: 600; }
        .rank-1 { color: #ffd700; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        .score {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .good { color: #3fb950; }
        .mid { color: #d29922; }
        .bad { color: #f85149; }
        .checkbox-cell { text-align: center; }
        input[type="checkbox"] {
            accent-color: #58a6ff;
            cursor: pointer;
        }
        .compare-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 12px 24px;
            text-align: center;
            z-index: 100;
        }
        .compare-bar.visible { display: block; }
    </style>
</head>
<body>
    <h1>rag-bench Leaderboard</h1>
    <p class="subtitle">Code RAG MCP Server Benchmark — comparing retrieval quality, speed, and efficiency</p>

    <div class="controls">
        <label>Sort by:
            <select id="sortSelect">
                <option value="composite_score">Composite Score</option>
                <option value="hit_at_1">Hit@1</option>
                <option value="hit_at_5">Hit@5</option>
                <option value="symbol_hit_at_5">Symbol Hit@5</option>
                <option value="chunk_hit_at_5">Chunk Hit@5</option>
                <option value="mrr">MRR</option>
                <option value="query_latency_p50_ms">Latency p50</option>
                <option value="query_latency_p95_ms">Latency p95</option>
                <option value="ingest_total_sec">Ingest Time</option>
                <option value="ram_peak_mb">RAM Peak</option>
                <option value="avg_response_tokens">Avg Tokens</option>
                <option value="p95_response_tokens">P95 Tokens</option>
                <option value="avg_llm_tokens">Avg LLM Tokens</option>
                <option value="by_difficulty">By Difficulty</option>
                <option value="by_type">By Type</option>
            </select>
        </label>
        <button id="compareBtn" onclick="navigateToCompare()">Compare Selected</button>
    </div>

    <table id="leaderboard">
        <thead>
            <tr>
                <th></th>
                <th>#</th>
                <th>Server</th>
                <th>User</th>
                <th data-sort="hit_at_1" title="Fraction of queries where the correct file was the #1 result returned by the search engine — higher is better">Hit@1</th>
                <th data-sort="hit_at_5" title="Fraction of queries where the correct file was in the top 5 results returned by the search engine — higher is better">Hit@5</th>
                <th data-sort="symbol_hit_at_5" title="Fraction of queries where the correct code symbol (function or class name) was found in the top 5 results">Sym@5</th>
                <th data-sort="chunk_hit_at_5" title="Chunk Hit@5 &mdash; fraction of queries where the correct code chunk (function/class body) was found in the top 5 results">Chunk@5</th>
                <th data-sort="mrr" title="Mean Reciprocal Rank — average of 1 divided by the rank of the first correct result across all queries, higher values mean earlier hits">MRR</th>
                <th data-sort="query_latency_p50_ms" title="Median query latency in milliseconds — 50% of all queries were faster than this response time">p50 ms</th>
                <th data-sort="query_latency_p95_ms" title="95th percentile query latency in milliseconds — 95% of all queries completed faster than this response time">p95 ms</th>
                <th data-sort="ingest_total_sec" title="Total time in seconds to clone and index the entire repository before running any benchmark queries">Ingest</th>
                <th data-sort="ram_peak_mb" title="Peak resident memory usage in megabytes during query execution across all benchmark queries">RAM</th>
                <th data-sort="composite_score" title="Composite score from 0 to 1 combining retrieval quality, query speed, and resource efficiency into a single rank">Score</th>
                <th data-sort="by_difficulty" title="Breakdown of Hit@5 retrieval accuracy by query difficulty level — E=easy, M=medium, H=hard — showing how well the RAG server performs on simpler versus more complex code questions">By Difficulty</th>
                <th data-sort="by_type" title="Breakdown of Hit@5 retrieval accuracy by query category — loc=locate, cal=callers, exp=explain, imp=impact — showing how the RAG server handles different kinds of code understanding questions">By Type</th>
                <th data-sort="avg_response_tokens" title="Average number of output tokens returned by the MCP server per query across all benchmark queries">Avg Tokens</th>
                <th data-sort="p95_response_tokens" title="95th percentile of output tokens — 95% of queries returned fewer tokens than this count">P95 Tokens</th>
                <th data-sort="avg_llm_tokens" title="Average number of tokens consumed by the underlying language model when generating responses for each query">Avg LLM Tokens</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <div class="compare-bar" id="compareBar">
        <button onclick="navigateToCompare()">Compare Selected</button>
    </div>

    <script>
        let entries = [];
        let selected = new Set();
        let currentSort = 'composite_score';
        let currentOrder = 'desc';

        async function loadData() {
            const sort = document.getElementById('sortSelect').value;
            const isBreakdown = sort === 'by_difficulty' || sort === 'by_type';
            const order = isBreakdown ? 'desc' : (
                ['query_latency_p50_ms', 'query_latency_p95_ms', 'ingest_total_sec', 'ram_peak_mb',
                 'avg_response_tokens', 'p95_response_tokens', 'avg_llm_tokens'].includes(sort) ? 'asc' : 'desc');
            try {
                // For breakdown columns, fetch unsorted then sort client-side
                const serverSort = isBreakdown ? 'composite_score' : sort;
                const serverOrder = isBreakdown ? 'desc' : order;
                const res = await fetch(`/api/leaderboard?sort_by=${serverSort}&order=${serverOrder}&limit=50`);
                const data = await res.json();
                entries = data.entries || [];
                if (isBreakdown) {
                    entries.sort((a, b) => {
                        const ka = breakdownSortKey(a[sort]);
                        const kb = breakdownSortKey(b[sort]);
                        if (currentOrder === 'asc') return ka - kb;
                        return kb - ka;
                    });
                }
                renderTable();
            } catch (e) {
                document.getElementById('tbody').innerHTML = '<tr><td colspan="19" class="empty">Failed to load data</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tbody');
            if (!entries.length) {
                tbody.innerHTML = '<tr><td colspan="19" class="empty">No benchmark results yet. Run: rag-bench run --preset nova-rag</td></tr>';
                return;
            }

            tbody.innerHTML = entries.map((e, i) => {
                const rank = i + 1;
                const rankClass = rank <= 3 ? `rank rank-${rank}` : 'rank';
                const detailUrl = `detail.html?run_id=${encodeURIComponent(e.run_id || e.id)}`;
                const name = e.git_url
                    ? `<a href="${esc(e.git_url)}" target="_blank">${esc(e.server_name)}</a>`
                    : `<a href="${detailUrl}">${esc(e.server_name)}</a>`;
                const user = e.git_user
                    ? `<a href="https://github.com/${esc(e.git_user)}" target="_blank">@${esc(e.git_user)}</a>`
                    : '-';

                return `<tr>
                    <td class="checkbox-cell"><input type="checkbox" data-id="${e.run_id}" onchange="onSelect(this)" ${selected.has(e.run_id) ? 'checked' : ''}></td>
                    <td class="${rankClass}">${rank}</td>
                    <td>${name}</td>
                    <td>${user}</td>
                    <td class="metric">${pct(e.hit_at_1)}</td>
                    <td class="metric">${pct(e.hit_at_5)}</td>
                    <td class="metric">${pct(e.symbol_hit_at_5)}</td>
                    <td class="metric">${pct(e.chunk_hit_at_5 || 0)}</td>
                    <td class="metric">${e.mrr.toFixed(4)}</td>
                    <td class="metric">${e.query_latency_p50_ms.toFixed(0)}</td>
                    <td class="metric">${e.query_latency_p95_ms.toFixed(0)}</td>
                    <td class="metric">${e.ingest_total_sec.toFixed(1)}s</td>
                    <td class="metric">${e.ram_peak_mb.toFixed(0)} MB</td>
                    <td class="score ${scoreClass(e.composite_score)}">${e.composite_score.toFixed(4)}</td>
                    <td class="metric">${fmtBreakdown(e.by_difficulty)}</td>
                    <td class="metric">${fmtBreakdown(e.by_type)}</td>
                    <td class="metric">${fmtTokens(e.avg_response_tokens)}</td>
                    <td class="metric">${fmtTokens(e.p95_response_tokens)}</td>
                    <td class="metric">${fmtTokens(e.avg_llm_tokens)}</td>
                </tr>`;
            }).join('');
        }

        function pct(v) { return (v * 100).toFixed(1) + '%'; }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function scoreClass(s) { return s >= 0.7 ? 'good' : s >= 0.4 ? 'mid' : 'bad'; }
        function fmtTokens(v) {
            if (v == null || v === 0) return '0';
            return Math.round(v).toLocaleString();
        }

        function fmtBreakdown(obj) {
            if (!obj || typeof obj === 'string' && obj === '{}') return '-';
            if (typeof obj === 'string') {
                try { obj = JSON.parse(obj); } catch (e) { return '-'; }
            }
            if (typeof obj !== 'object' || Object.keys(obj).length === 0) return '-';
            const abbr = { easy: 'E', medium: 'M', hard: 'H', locate: 'loc', callers: 'cal', explain: 'exp', impact: 'imp' };
            return Object.entries(obj).map(([k, v]) => {
                const key = abbr[k] || k;
                const val = v && v.hit_at_5 != null ? (v.hit_at_5 * 100).toFixed(0) + '%' : '-';
                return key + ':' + val;
            }).join(' ');
        }

        function breakdownSortKey(obj) {
            // Compute a sort key from the breakdown object: average of all hit_at_5 values
            if (!obj) return -1;
            if (typeof obj === 'string') {
                try { obj = JSON.parse(obj); } catch (e) { return -1; }
            }
            if (typeof obj !== 'object' || Object.keys(obj).length === 0) return -1;
            const vals = Object.values(obj).map(v => v.hit_at_5).filter(v => v != null);
            if (vals.length === 0) return -1;
            return vals.reduce((a, b) => a + b, 0) / vals.length;
        }

        function onSelect(cb) {
            if (cb.checked) selected.add(cb.dataset.id);
            else selected.delete(cb.dataset.id);
            document.getElementById('compareBar').className = selected.size >= 2 ? 'compare-bar visible' : 'compare-bar';
        }

        function navigateToCompare() {
            const selectedEntries = entries.filter(e => selected.has(e.run_id));
            if (selectedEntries.length < 2) {
                alert('Select at least 2 servers to compare');
                return;
            }
            const ids = selectedEntries.map(e => encodeURIComponent(e.run_id));
            window.location.href = '/compare?run_ids=' + ids.join(',');
        }

        // Header sort
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const sortKey = th.dataset.sort;
                const isBreakdown = sortKey === 'by_difficulty' || sortKey === 'by_type';
                if (isBreakdown && currentSort === sortKey) {
                    currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    currentOrder = 'desc';
                }
                currentSort = sortKey;
                document.getElementById('sortSelect').value = sortKey;
                loadData();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', loadData);

        // Initial load
        loadData();
    </script>
</body>
</html>
